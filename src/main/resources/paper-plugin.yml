name: RPG
version: '0.1.0'
main: com.sunucu.rpg.RpgPlugin
api-version: '26.2'

# Komutlar burada değil, her modül kendi komutunu kodda kaydeder (Brigadier).
# Böylece iki kişi aynı dosyada çakışmaz.
permissions:
  rpg.social.chat.moderate:
    description: Sohbeti temizleme ve kilitleme
    default: op
  rpg.social.chat.staff:
    description: Yetkili sohbet kanalını görme ve yazma (/sc)
    default: op
  rpg.social.chat.spy:
    description: Başkalarının özel mesajlarını görme (/socialspy)
    default: op
  rpg.social.announce:
    description: Herkese duyuru yapma (/duyuru)
    default: op
  rpg.moderation.mute:
    description: /mute, /unmute
    default: op
  rpg.moderation.ban:
    description: /ban, /unban
    default: op
  rpg.moderation.kick:
    description: /kick
    default: op
  rpg.moderation.warn:
    description: /warn
    default: op
  rpg.moderation.history:
    description: /geçmiş (ceza geçmişi)
    default: op
  rpg.moderation.chatlog:
    description: /chatlog (oyuncunun son mesajları, özel mesajlar dahil)
    default: op
  rpg.moderation.reports:
    description: Şikayet bildirimleri ve /şikayetler
    default: op
  rpg.moderation.notify:
    description: Verilen cezaların bildirimini görme
    default: op
  rpg.moderation.exempt:
    description: Moderasyondan muaf (sadece konsol cezalandırabilir)
    default: op
  rpg.social.inventory.edit:
    description: Sohbette paylaşılan [inv]'e tıklayınca oyuncunun gerçek envanterini açıp düzenleme
    default: op
  rpg.social.badge.admin:
    description: Sohbette [Admin] rozeti
    default: op
  rpg.social.badge.mod:
    description: Sohbette [Mod] rozeti
    default: false
  rpg.social.badge.helper:
    description: Sohbette [Rehber] rozeti (yardım kanalı gönüllüleri)
    default: false
  rpg.social.chat.bypass:
    description: Filtre, bekleme süresi ve kilide takılmama
    default: op
