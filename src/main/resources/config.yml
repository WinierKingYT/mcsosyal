# Otomatik ipuçları: interval-seconds aralıkla sırayla gönderilir (0: kapalı). Oyuncu /sosyal → Bildirimler'den
# kapatır. Tam MiniMessage çalışır (tıklanabilir bağlantı dahil); <name> okuyanın adı, <online> çevrimiçi sayısı.
announcements:
  interval-seconds: 300
  tips:
    - "Sohbet kanalını değiştirmek için <click:run_command:/sosyal><white><u>/sosyal</u></white></click> yaz."
    - "Elindeki eşyayı sohbette göstermek için mesajına <white>[i]</white> ekle, envanterin için <white>[inv]</white>."
    - "Arkadaş eklemek için <white>/arkadaş ekle isim</white> yaz."
    - "Bir oyuncunun profilini görmek için sohbette ismine tıkla."
    - "Sadece yakındakilere yazmak için mesajının başına <white>!</white> koy."

# Parti: geçici (sunucu yeniden başlayınca dağılır). Davet invite-seconds saniye geçerli.
# default-size: yeni partinin boyutu. size-limit: liderin ayarlardan büyütebileceği en fazla (2-10).
# VIP: rpg.party.size.<n> izni (ör. rpg.party.size.10) n kişiye kadar büyütür. Admin (rpg.party.admin) her partiyi
# düzenler ve 10'a kadar çıkarır.
# defaults: yeni kurulan partinin ayarları (lider /parti ayarlar'dan değiştirir).
#   open: listede görünür, herkes katılır. members-invite: üyeler de davet eder. friendly-fire: üyeler birbirine vurur.
party:
  default-size: 5
  size-limit: 5
  invite-seconds: 60
  defaults:
    open: true
    members-invite: false
    friendly-fire: false
    # Parti rengi: üyeler birbirinin sohbet mesajını bu renkte görür. aqua, dark_aqua, green, yellow, gold, red,
    # light_purple, white.
    color: aqua

# Moderasyon. Sohbet ve özel mesaj kayıtları chat-log-days günden eskiyse açılışta silinir.
moderation:
  chat-log-days: 30
  report-cooldown-seconds: 60
  # Uyarı birikince otomatik ceza: son warn-window-days gün içindeki uyarı sayısı tam "warnings" olunca çalışır.
  # action: mute, ban ya da kick. duration yoksa kalıcı (kick'te süre yok). Kapatmak için: warn-escalation: []
  warn-window-days: 30
  warn-escalation:
    - warnings: 3
      action: mute
      duration: 1h
    - warnings: 5
      action: ban
      duration: 1d
  # Yeni oyuncu: oynama süresi bu kadar dakikadan azsa bağlantı paylaşamaz, yetkili olmayanlara özel mesaj atamaz.
  # Reklam botlarına karşı. 0: kapalı.
  new-player-minutes: 10

# İsimli bölgeler: [konum] paylaşımında koordinatla birlikte bölge adı görünür.
# from/to iki köşenin [x, z] koordinatı, yükseklik fark etmez. İç içe bölgelerde küçük olanı üste yaz.
regions:
  - name: "Başlangıç Köyü"
    world: world
    from: [-100, -100]
    to: [100, 100]
