# Tüm yazılar MiniMessage formatındadır: https://docs.advntr.dev/minimessage/format
# Oyuncunun yazdığı metin her zaman düz metin olarak eklenir, etiketleri çalışmaz.

chat:
  # <channel>, <badge>, <tags>, <name>, <message> yer tutucuları kullanılabilir.
  format: "<dark_gray>[<channel>]</dark_gray> <badge><tags><white><name></white><gray>:</gray> <message>"
  # Yetkili rozetleri: yukarıdan aşağı, izni olan ilk rozet gösterilir. Sondaki boşluk isimle arayı açar.
  badges:
    - permission: rpg.social.badge.admin
      tag: "<dark_red>[Admin]</dark_red> "
    - permission: rpg.social.badge.mod
      tag: "<blue>[Mod]</blue> "
    - permission: rpg.social.badge.helper
      tag: "<green>[Rehber]</green> "
  # [konum] ile paylaşılan dünyaların görünen adları.
  world-names:
    world: "Dünya"
    world_nether: "Nether"
    world_the_end: "End"
  # Oyuncu yazacağı kanalı /sosyal → Sohbet Kanalları'ndan seçer (sağ tık: kanalı gizle). Yetkililer /sc ile de yazar.
  # name, icon ve description panelde, tag sohbet satırında görünür. icon bir Minecraft eşya adıdır (ör. BELL).
  # description'da satırlar \n ile ayrılır.
  # Bekleme süresi kanal başınadır. permission verilen kanalı sadece o izne sahip olanlar görür ve yazar.
  channels:
    global:
      name: "<gold>Global</gold>"
      icon: BELL
      description: "<gray>Sunucudaki herkes görür."
      tag: "<gold>G</gold>"
      cooldown-millis: 2000
    local:
      name: "<green>Yerel</green>"
      icon: OAK_SAPLING
      description: "<gray>Sadece 64 blok içindekiler görür.\n<gray>Kısayol: mesajın başına <white>!</white> koy (ör. <white>!selam</white>)"
      tag: "<green>Y</green>"
      cooldown-millis: 2000
      radius: 64
    trade:
      name: "<aqua>Ticaret</aqua>"
      icon: EMERALD
      description: "<gray>Alım satım için. Herkes görür."
      tag: "<aqua>T</aqua>"
      cooldown-millis: 3000
    help:
      name: "<yellow>Yardım</yellow>"
      icon: BOOK
      description: "<gray>Soru sor, <green>Rehber</green><gray>ler yanıtlasın."
      tag: "<yellow>?</yellow>"
      cooldown-millis: 2000
    staff:
      name: "<red>Yetkili</red>"
      icon: REDSTONE
      description: "<gray>Sadece yetkililer görür.\n<gray>Kısayol: <white>/sc mesaj</white>"
      tag: "<red>Yetkili</red>"
      cooldown-millis: 0
      permission: rpg.social.chat.staff
    party:
      name: "<light_purple>Parti</light_purple>"
      icon: CAKE
      description: "<gray>Sadece parti üyelerin görür.\n<gray>Kısayol: <white>/p mesaj</white>"
      tag: "<light_purple>Parti</light_purple>"
      cooldown-millis: 1000
  # Sohbette ismin üstüne gelince çıkan oyuncu kartı. Her satır bir değere bağlı (stat); değerleri RPG sistemi
  # verir, değer yoksa satır gösterilmez. Sırayı ve hangi bilgilerin görüneceğini buradan seç.
  player-card:
    - stat: class
      line: "<gray>Sınıf: <white><value></white></gray>"
    - stat: level
      line: "<gray>Seviye: <white><value></white></gray>"
    - stat: guild
      line: "<gray>Lonca: <white><value></white></gray>"
    # playtime bizden gelir (Minecraft'ın oynama süresi istatistiği), RPG tarafına gerek yok.
    - stat: playtime
      line: "<gray>Oynama süresi: <white><value></white></gray>"
  # Mesajın başına bu karakter konunca, seçili kanal ne olursa olsun yerel kanala gider.
  local-prefix: "!"
  # Minecraft ses anahtarları. Oyuncular /sosyal → Bildirimler'den kapatabilir.
  sounds:
    mention: "entity.experience_orb.pickup"
    private-message: "block.note_block.pling"
    friend: "block.note_block.chime"
    announcement: "block.note_block.bell"
  # Arkadaş sınırı; panel tek sayfa olduğu için en fazla 45.
  friends:
    max: 45
  # Bu kadar saniye hareketsiz kalan oyuncu AFK sayılır. /afk ile elle de olunur.
  afk-after-seconds: 300
  # Aynı mesaj bu süre içinde tekrar gönderilemez.
  duplicate-window-millis: 3000
  # Bekleme/tekrar yüzünden engellenen denemeler window-seconds içinde sayılır: warn-after denemede sert uyarı,
  # mute-after denemede mute-minutes dakika susturma. Yetkili /chat unmute <oyuncu> ile kaldırır.
  spam:
    window-seconds: 60
    warn-after: 5
    mute-after: 10
    mute-minutes: 5
  # Etiketlenen oyuncuya ekran yazısı ve ses en fazla bu sıklıkta gider.
  mention-cooldown-seconds: 10
  # Bu kadar harften uzun ve çoğu büyük harfse mesaj küçültülür.
  caps-min-letters: 6
  caps-ratio: 0.7
  # Normalleştirilmiş halleriyle eşleşir (ı→i, ş→s, tekrar eden harfler tek).
  banned-words:
    - aptal
    - salak
  # Reklam filtresi IP ve alan adlarını engeller; bunlar serbest (ör. kendi siteniz).
  allowed-domains:
    - youtube.com

messages:
  welcome: "<yellow><name></yellow> <gray>sunucuya ilk kez katıldı, hoş geldin!</gray>"
  # <seconds>: tekrar yazabilmeye kalan süre.
  cooldown: "<red>Çok hızlı yazıyorsun, <seconds> saniye bekle.</red>"
  duplicate: "<red>Aynı mesajı tekrar göndermek için <seconds> saniye bekle.</red>"
  banned-word: "<red>Mesajın uygunsuz kelime içeriyor.</red>"
  advertisement: "<red>Sohbette sunucu adresi ya da bağlantı paylaşamazsın.</red>"
  chat-locked: "<red>Sohbet şu an kilitli.</red>"
  spam-warning: "<gold>⚠ Spam yapma! <left> deneme daha yaparsan sohbetten susturulacaksın.</gold>"
  spam-muted: "<red>Spam yüzünden <minutes> dakika susturuldun.</red>"
  muted: "<red>Susturuldun, <minutes> dakika kaldı.</red>"
  unmuted: "<green><name> artık konuşabilir.</green>"
  not-muted: "<gray><name> susturulmamış.</gray>"
  # /me: seçili kanala gider, filtreden geçer.
  emote: "<dark_gray>[<channel>]</dark_gray> <light_purple>* <name> <message></light_purple>"
  command-disabled: "<red>Bu komut bu sunucuda kapalı.</red>"
  # Giriş öncesi oyuncu verisi okunamazsa oyuncu bu mesajla geri çevrilir (veritabanı hatası).
  data-load-failed: "<red>Oyuncu verilerin yüklenemedi. Lütfen biraz sonra tekrar dene.</red>"
  message-error: "<red>Mesajın gönderilemedi, bir hata oluştu. Yetkililere bildir.</red>"
  lock-on: "<yellow>Sohbet <name> tarafından kilitlendi.</yellow>"
  lock-off: "<green>Sohbet kilidi <name> tarafından açıldı.</green>"
  cleared: "<gray>Sohbet <name> tarafından temizlendi.</gray>"
  msg-to: "<light_purple>[Sen → <name>]</light_purple> <message>"
  msg-from: "<light_purple>[<name> → Sen]</light_purple> <message>"
  msg-self: "<red>Kendine mesaj gönderemezsin.</red>"
  msg-ignored: "<red>Bu oyuncu seni engellemiş.</red>"
  reply-none: "<red>Cevap verecek kimse yok.</red>"
  reply-offline: "<red>O oyuncu artık çevrimiçi değil.</red>"
  ignore-on: "<gray><name> artık engellendi.</gray>"
  ignore-off: "<gray><name> artık engellenmiyor.</gray>"
  # @isim herkese böyle görünür; okuyanın kendi adıysa mention-self kullanılır.
  mention: "<aqua><text></aqua>"
  mention-self: "<yellow><bold><text></bold></yellow>"
  # Etiketlenince ekranın ortasında çıkan yazı.
  mention-title: "<yellow><name></yellow>"
  mention-subtitle: "<gray>senden sohbette bahsetti</gray>"
  # [item] / [eşya]: <item> eşyanın adı (üstüne gelince özellikleri), <amount> adedi.
  item: "<item>"
  item-many: "<item><gray> x<amount></gray>"
  item-empty: "<gray>[boş el]</gray>"
  # [inv] / [envanter]: tıklayınca envanter salt okunur pencerede açılır. Eşyaya tıklamak da pencere açar.
  inventory: "<gold>[Envanter: <name>]</gold>"
  inventory-hover: "<gray>Tıkla: envanteri gör</gray>"
  view-inventory-title: "<name> - Envanter"
  view-empty-armor: "<gray><slot> yok</gray>"
  view-empty-armor-lore: "<dark_gray>Bu yuva boş."
  view-inventory-edit-title: "<name> - Envanter (düzenle)"
  # [konum]: tıklayınca "x y z" panoya kopyalanır.
  # <place>: bulunduğu bölgenin adı (regions), bölge yoksa dünya adı. <world> her zaman dünya adı.
  location: "<green>[<place> <x>, <y>, <z>]</green>"
  location-hover: "<gray>Tıkla: koordinatları kopyala</gray>"
  spy: "<dark_gray>[Spy] <from> → <to>:</dark_gray> <gray><message></gray>"
  spy-on: "<gray>Social spy <green>açık</green>.</gray>"
  spy-off: "<gray>Social spy <red>kapalı</red>.</gray>"
  afk-on: "<gray>Artık AFK'sın.</gray>"
  afk-off: "<gray>Artık AFK değilsin.</gray>"
  # Tab listesinde AFK oyuncunun ismi.
  afk-tab: "<dark_gray><name> [AFK]</dark_gray>"
  msg-afk: "<gray><name> şu an AFK, mesajını sonra görebilir.</gray>"
  # Oyuncu kartının başlığı ve en alttaki ipucu (satırlar chat.player-card).
  player-card-header: "<yellow><name></yellow>"
  name-hover: "<gray>Tıkla: <white><name></white><gray> profilini aç</gray>"

