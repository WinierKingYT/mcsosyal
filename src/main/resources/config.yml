# Tüm yazılar MiniMessage formatındadır: https://docs.advntr.dev/minimessage/format
# Oyuncunun yazdığı metin her zaman düz metin olarak eklenir, etiketleri çalışmaz.

chat:
  # <channel>, <badge>, <tags>, <name>, <message> yer tutucuları kullanılabilir.
  format: "<dark_gray>[<channel>]</dark_gray> <badge><tags><white><name></white><gray>:</gray> <message>"
  # Yetkili rozetleri: yukarıdan aşağı, izni olan ilk rozet gösterilir. Sondaki boşluk isimle arayı açar.
  badges:
    - permission: rpg.social.badge.admin
      tag: "<dark_red>[Admin]</dark_red> "
    - permission: rpg.social.badge.mod
      tag: "<blue>[Mod]</blue> "
    - permission: rpg.social.badge.helper
      tag: "<green>[Rehber]</green> "
  # [konum] ile paylaşılan dünyaların görünen adları.
  world-names:
    world: "Dünya"
    world_nether: "Nether"
    world_the_end: "End"
  # Kanal komutları: /l (yerel), /t (ticaret), /yardım (yardım), /sc (yetkili).
  # Bekleme süresi kanal başınadır. permission verilen kanalı sadece o izne sahip olanlar görür ve yazar.
  channels:
    global:
      tag: "<gold>G</gold>"
      cooldown-millis: 2000
    local:
      tag: "<green>Y</green>"
      cooldown-millis: 2000
      radius: 64
    trade:
      tag: "<aqua>T</aqua>"
      cooldown-millis: 45000
    help:
      tag: "<yellow>?</yellow>"
      cooldown-millis: 2000
    staff:
      tag: "<red>Yetkili</red>"
      cooldown-millis: 0
      permission: rpg.social.chat.staff
  # Mesajın başına bu karakter konunca yerel kanala gider.
  local-prefix: "!"
  # Minecraft ses anahtarları. Oyuncular /bildirim etiket|mesaj ile kapatabilir.
  sounds:
    mention: "entity.experience_orb.pickup"
    private-message: "block.note_block.pling"
  # Bu kadar saniye hareketsiz kalan oyuncu AFK sayılır. /afk ile elle de olunur.
  afk-after-seconds: 300
  # Bu kadar harften uzun ve çoğu büyük harfse mesaj küçültülür.
  caps-min-letters: 6
  caps-ratio: 0.7
  # Normalleştirilmiş halleriyle eşleşir (ı→i, ş→s, tekrar eden harfler tek).
  banned-words:
    - aptal
    - salak
  # Reklam filtresi IP ve alan adlarını engeller; bunlar serbest (ör. kendi siteniz).
  allowed-domains:
    - youtube.com

messages:
  welcome: "<yellow><name></yellow> <gray>sunucuya ilk kez katıldı, hoş geldin!</gray>"
  cooldown: "<red>Biraz yavaş, tekrar yazmadan önce bekle.</red>"
  duplicate: "<red>Aynı mesajı tekrar gönderemezsin.</red>"
  banned-word: "<red>Mesajın uygunsuz kelime içeriyor.</red>"
  advertisement: "<red>Sohbette sunucu adresi ya da bağlantı paylaşamazsın.</red>"
  chat-locked: "<red>Sohbet şu an kilitli.</red>"
  lock-on: "<yellow>Sohbet <name> tarafından kilitlendi.</yellow>"
  lock-off: "<green>Sohbet kilidi <name> tarafından açıldı.</green>"
  cleared: "<gray>Sohbet <name> tarafından temizlendi.</gray>"
  msg-to: "<light_purple>[Sen → <name>]</light_purple> <message>"
  msg-from: "<light_purple>[<name> → Sen]</light_purple> <message>"
  msg-self: "<red>Kendine mesaj gönderemezsin.</red>"
  msg-ignored: "<red>Bu oyuncu seni engellemiş.</red>"
  reply-none: "<red>Cevap verecek kimse yok.</red>"
  reply-offline: "<red>O oyuncu artık çevrimiçi değil.</red>"
  ignore-on: "<gray><name> artık engellendi.</gray>"
  ignore-off: "<gray><name> artık engellenmiyor.</gray>"
  # @isim herkese böyle görünür; okuyanın kendi adıysa mention-self kullanılır.
  mention: "<aqua><text></aqua>"
  mention-self: "<yellow><bold><text></bold></yellow>"
  # [item] / [eşya]: <item> eşyanın adı (üstüne gelince özellikleri), <amount> adedi.
  item: "<item>"
  item-many: "<item><gray> x<amount></gray>"
  item-empty: "<gray>[boş el]</gray>"
  # [konum]: tıklayınca "x y z" panoya kopyalanır.
  location: "<green>[<world> <x>, <y>, <z>]</green>"
  location-hover: "<gray>Tıkla: koordinatları kopyala</gray>"
  spy: "<dark_gray>[Spy] <from> → <to>:</dark_gray> <gray><message></gray>"
  spy-on: "<gray>Social spy <green>açık</green>.</gray>"
  spy-off: "<gray>Social spy <red>kapalı</red>.</gray>"
  afk-on: "<gray>Artık AFK'sın.</gray>"
  afk-off: "<gray>Artık AFK değilsin.</gray>"
  # Tab listesinde AFK oyuncunun ismi.
  afk-tab: "<dark_gray><name> [AFK]</dark_gray>"
  msg-afk: "<gray><name> şu an AFK, mesajını sonra görebilir.</gray>"
  sound-on:"<gray><type> sesi <green>açık</green>.</gray>"
  sound-off: "<gray><type> sesi <red>kapalı</red>.</gray>"
  name-hover:"<gray>Tıkla: <white><name></white> oyuncusuna özel mesaj</gray>"
